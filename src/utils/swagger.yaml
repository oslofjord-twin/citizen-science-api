openapi: 3.0.0
info:
  title: Oslofjord Data & Gamification API
  version: 1.0.0
  description: |
    API for the Citizen Science app in the Digital Twin of the Oslo fjord.
    
    ### Standard Request Headers
    All authenticated endpoints require the following headers in your HTTP requests:
    
    headers: {
      'Content-Type': 'application/json',
      'Cookie': 'better-auth.session_token=<your_session_token>'
    }
servers:
  - url: /
    description: Current Environment

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: "Required header: `Cookie: better-auth.session_token=<token>`"

security:
  - cookieAuth: []

tags:
  - name: System
  - name: Users
  - name: Community
  - name: Measurements
  - name: Temperature
  - name: Simulation

paths:
  /health:
    get:
      summary: Server health check
      tags: [System]
      security: [] 
      responses:
        '200':
          description: Server is healthy

  /api/user/profile:
    get:
      summary: Get logged-in user's profile
      tags: [Users]
      responses:
        '200':
          description: Successfully retrieved user profile including active badges and avatars
          content:
            application/json:
              example:
                success: true
                user: 
                  id: "user123"
                  name: "Jane Doe"
                  email: "jane@example.com"
                  total_points: 1200
                  level: 5
                  createdAt: "2023-01-01T12:00:00Z"
                  badge_name: "Ocean Explorer"
                  badge_image_url: "https://example.com/badges/explorer.png"
                  avatar_name: "Diver"
                  avatar_image_url: "https://example.com/avatars/diver.png"
        '404':
          description: User not found

  /api/user/leaderboard:
    get:
      summary: Get the global user leaderboard
      tags: [Users]
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: timespan
          schema:
            type: string
            enum: [all, week, month]
            default: all
      responses:
        '200':
          description: Leaderboard array and current user's rank
          content:
            application/json:
              example:
                success: true
                timespan: "all"
                leaderboard: 
                  - id: "user456"
                    name: "John Smith"
                    level: 10
                    total_points: 5000
                    badge_name: "Master Biologist"
                    badge_image_url: "https://example.com/badges/master.png"
                    avatar_name: "Scientist"
                    avatar_image_url: "https://example.com/avatars/scientist.png"
                currentUser: 
                  id: "user123"
                  name: "Jane Doe"
                  level: 5
                  total_points: 1200
                  rank: 42
                  badge_name: "Ocean Explorer"
                  badge_image_url: "https://example.com/badges/explorer.png"

  /api/user/achievements:
    get:
      summary: Get user's earned achievements
      tags: [Users]
      responses:
        '200':
          description: Array of earned achievements
          content:
            application/json:
              example:
                success: true
                achievements:
                  - user_id: "user123"
                    achievement_id: 1
                    achievement_name: "First Submission"
                    achievement_description: "Submitted your first measurement."
                    achievement_image_url: "https://example.com/achievements/first.png"
                    earned_at: "2023-10-15T12:00:00Z"

  /api/user/avatars:
    get:
      summary: Get a list of all available avatars
      tags: [Users]
      responses:
        '200':
          description: Array of avatars
          content:
            application/json:
              example:
                success: true
                avatars:
                  - id: 1
                    name: "Diver"
                    description: "A cool deep-sea diver."
                    image_url: "https://example.com/avatars/diver.png"

  /api/user/avatars/select:
    put:
      summary: Assign a specific avatar to the user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [avatarId]
              properties:
                avatarId:
                  type: integer
                  example: 1
      responses:
        '200':
          description: Avatar successfully assigned to user
        '400':
          description: avatarId is required

  /api/community/weekly-goal:
    get:
      summary: Get the current weekly community goal
      tags: [Community]
      responses:
        '200':
          description: Weekly goal details and progress
          content:
            application/json:
              example:
                success: true
                weekly_goal: 
                  goal_points: 10000
                  current_points: 4500
                  start_date: "2023-10-16"
                  end_date: "2023-10-22"
                  progress_percent: 45.00

  /api/measurements:
    get:
      summary: Get measurements for the user with filters
      tags: [Measurements]
      parameters:
        - in: query
          name: data_type
          schema: { type: string }
        - in: query
          name: latitude
          schema: { type: number }
        - in: query
          name: longitude
          schema: { type: number }
        - in: query
          name: radius_km
          schema: { type: number }
        - in: query
          name: limit
          schema: { type: integer, default: 10, maximum: 10 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
        - in: query
          name: start_date
          schema: { type: string, format: date-time }
        - in: query
          name: end_date
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: A list of measurements with joined temperature data and pagination info
          content:
            application/json:
              example:
                success: true
                measurements: 
                  - id: "uuid-1234"
                    latitude: 59.9139
                    longitude: 10.7522
                    timestamp: "2023-10-15T12:00:00Z"
                    data_type: "temperature"
                    user_id: "user123"
                    measurement_notes: "Clear water"
                    quality_flag: null
                    created_at: "2023-10-15T12:00:00Z"
                    updated_at: "2023-10-15T12:00:00Z"
                    points_earned: 10
                    value_celsius: 14.5
                    depth_meters: 2.5
                    instrument_type: "Digital Thermometer"
                    temperature_notes: "Clear water"
                pagination: 
                  total: 45
                  limit: 10
                  offset: 0
                  hasMore: true

  /api/measurements/{id}:
    delete:
      summary: Delete a specific measurement
      tags: [Measurements]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Measurement deleted successfully
        '400':
          description: Measurement not found or access denied

  /api/temperature:
    post:
      summary: Record a new temperature measurement
      description: |
        Must be within the Oslofjord area. 
        Note: Depth (meters) factors into gamification point calculation bonuses.
      tags: [Temperature]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value_celsius, latitude, longitude, measurement_date]
              properties:
                value_celsius:
                  type: number
                  example: 14.5
                latitude:
                  type: number
                  example: 59.9139
                longitude:
                  type: number
                  example: 10.7522
                measurement_date:
                  type: string
                  format: date-time
                  example: "2023-10-15T12:00:00Z"
                depth_meters:
                  type: number
                  example: 2.5
                instrument_type:
                  type: string
                  example: "Digital Thermometer"
                notes:
                  type: string
                  example: "Water looked clear."
      responses:
        '201':
          description: Measurement recorded, points awarded, and potential achievements unlocked
          content:
            application/json:
              example:
                success: true
                points_earned: 14
                total_points: 1214
                level: 5
                measurement: 
                  id: "uuid-1234"
                  latitude: 59.9139
                  longitude: 10.7522
                  timestamp: "2023-10-15T12:00:00Z"
                  data_type: "temperature"
                  user_id: "user123"
                  points_earned: 14
                  temperature_data:
                    id: "uuid-1234"
                    value_celsius: 14.5
                    depth_meters: 2.5
                    instrument_type: "Digital Thermometer"

  /api/simulation/species:
    get:
      summary: Get list of species available for simulation
      tags: [Simulation]
      responses:
        '200':
          description: Array of available species from Hasura
          content:
            application/json:
              example:
                success: true
                species:
                  - name: "Cod"
                  - name: "Salmon"

  /api/simulation/start:
    post:
      summary: Start a new geographic species simulation
      description: Orchestrates a Hasura grid lookup to verify coordinates before starting simulation.
      tags: [Simulation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude, species_name]
              properties:
                latitude:
                  type: number
                  example: 59.9139
                longitude:
                  type: number
                  example: 10.7522
                species_name:
                  type: string
                  example: "Cod"
      responses:
        '201':
          description: Simulation started successfully
          content:
            application/json:
              example:
                success: true
                requestId: 12345
                gridId: 67890
        '400':
          description: Outside Oslofjord area or no grid found

  /api/simulation/status/{requestId}:
    get:
      summary: Check the status of a running simulation
      tags: [Simulation]
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Done status of the simulation
          content:
            application/json:
              example:
                success: true
                done: true
        '404':
          description: Request not found

  /api/simulation/results:
    get:
      summary: Get completed simulation results
      tags: [Simulation]
      parameters:
        - in: query
          name: requestId
          required: true
          schema:
            type: integer
        - in: query
          name: gridId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Processed Hasura simulation data arrays
          content:
            application/json:
              example:
                success: true
                data: 
                  simulations:
                    - id_sim: 101
                      conductivity: 32.5
                      record_time: "2023-10-15T12:00:00Z"
                      temperature: 12.3
                      turbidity: 1.2
                  runtime_monitoring:
                    - id_sim: 101
                      preferred_spawning_temperature: true
                      suitable_spawning_temperature: true
                      suitable_temperature: true