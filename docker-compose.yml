services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 2s
      retries: 10

  tests:
    build: .
    environment:
      DATABASE_URL: postgres://testuser:testpass@db:5432/testdb
    depends_on:
      db:
        condition: service_healthy