services:
  db:
    image: postgres:16
    volumes:
      - ./tests/seed:/seed:ro
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 2s
      retries: 10

  tests:
    build: .
    env_file: .env.test
    depends_on:
      db:
        condition: service_healthy